<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tablero en vivo — Dictador y Ultimátum</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { max-width: 1100px; margin: 0 auto; align-items: stretch; }
    .dash-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .round-tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
    .round-tab { border: 1.5px solid var(--line); background: var(--paper-raised); border-radius: 100px; padding: 8px 16px;
      font-family: var(--sans); font-size: 0.85rem; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
    .round-tab.active { background: var(--bill); border-color: var(--bill); color: #fff; }
    .round-banner { background: var(--paper-raised); border-radius: var(--radius); padding: 18px 22px; box-shadow: var(--shadow); margin-bottom: 16px; }
    .round-banner h2 { margin-top: 2px; }
    .round-banner p { margin-bottom: 0; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .stat-card { background: var(--paper-raised); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
    .stat-card .num { font-family: var(--serif); font-size: 1.9rem; font-weight: 700; color: var(--bill); }
    .stat-card .lbl { font-size: 0.8rem; color: var(--ink-soft); margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; background: var(--paper-raised); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    th, td { text-align: left; padding: 11px 14px; font-size: 0.9rem; border-bottom: 1px solid var(--line); }
    th { color: var(--ink-soft); font-weight: 600; background: var(--paper); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
    tr.leader td { background: var(--accept-bg); font-weight: 700; }
    tr.leader td:first-child::before { content: "🏆 "; }
    .actions { display: flex; gap: 10px; }
    .actions .btn { width: auto; padding: 10px 16px; font-size: 0.88rem; }
    .prize-note { font-size: 0.85rem; color: var(--ink-soft); margin: 10px 0 14px; }
  </style>
</head>
<body>
  <div class="dash-header">
    <div>
      <div class="eyebrow">TABLERO EN VIVO</div>
      <h1>Dictador y Ultimátum — 5 rondas</h1>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" id="btnExport">Descargar CSV</button>
      <button class="btn btn-secondary" id="btnReset">Reiniciar sesión</button>
    </div>
  </div>

  <div class="round-tabs" id="roundTabs"></div>
  <div id="roundStats"></div>

  <h2>Tabla de posiciones</h2>
  <p class="prize-note">Máximo teórico posible en las 5 rondas: <b id="maxPossible"></b> — quien más acumule al final del curso recibe el equivalente en pesos reales.</p>
  <table>
    <thead><tr><th>#</th><th>Estudiante</th><th>Rondas jugadas</th><th>Total acumulado</th></tr></thead>
    <tbody id="leaderboardBody"></tbody>
  </table>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
